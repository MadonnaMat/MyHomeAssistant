# Permanent breadboard prototyping board — what's wired up on it changes often.
# Currently: minimal test harness for the local USB-serial-logs dev workflow
# (WSL + usbipd-win + `esphome logs`). Update this comment when repurposed.
esphome:
  name: breadboard-esp32
  friendly_name: breadboard-esp32
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
    then:
      - logger.log: "Hello, world!"

esp32:
  variant: esp32
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

interval:
  - interval: 5s
    then:
      - logger.log: "heartbeat"
