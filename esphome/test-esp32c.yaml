esphome:
  name: test-esp32c
  friendly_name: test-esp32c
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
    then:
      - logger.log: "Hello, world!"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dBm
