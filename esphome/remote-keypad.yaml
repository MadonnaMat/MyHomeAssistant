# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml

esphome:
  name: remote-keypad
  friendly_name: Remote Keypad
  min_version: 2025.11.0
  name_add_mac_suffix: false
  includes:
    - components/custom_hash.h
    - components/fram_mb85rc256.h
    - components/keypad_state.h
    - components/keypad_fram_store.h
    - components/keypad_tones.h
    - components/keypad_battery.h
    - components/keypad_display.h

  on_boot:
    # --- EXISTING: Your standard boot sequence ---
    - priority: -100
      then:
        - lambda: |-
            id(failed_attempts) = keypad_fram::restore_failed_attempts(id(i2c_bus));
            id(lockout_state) = (id(failed_attempts) >= 3) ? keypad_state::LOCKED : keypad_state::ACTIVE;

        - safe_mode.mark_successful
        - delay: 500ms
        - lambda: |-
            if(id(my_display).is_ready()) {
              id(my_display).turn_on();
            }
        - delay: 50ms
        - component.update: battery_voltage_raw
        - component.update: battery_capacity
        - component.update: my_display
        - delay: 2s
        - if:
            condition:
              binary_sensor.is_off: door_switch
            then:
              - logger.log: "Wakeup complete: Door is closed. Battery reported, returning to deep sleep."
              - lambda: |-
                  if(id(my_display).is_ready()) {
                    id(my_display).fill(Color::BLACK);
                    id(my_display).update();
                    id(my_display).turn_off();
                  }
              - delay: 100ms
              - deep_sleep.enter: my_deep_sleep
            else:
              - logger.log: "Wakeup complete: Door is open. Staying awake until closed."

preferences:
  flash_write_interval: 0s  # Commit preference/global changes immediately

substitutions:
  my_hash_salt: !secret keypad_salt
  ha_failed_attempts_entity: input_number.test_esp32c_failed_attempts

globals:
  - id: actual_pin
    type: std::string
    initial_value: '""'
  - id: display_pin
    type: std::string
    initial_value: '""'
  - id: lockout_state
    type: int
    initial_value: 'keypad_state::ACTIVE'
    # See components/keypad_state.h LockoutState: ACTIVE, PENDING, LOCKED, UNLOCKED
  - id: failed_attempts
    type: int
    restore_value: false
    initial_value: '0'

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 32
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

output:
  - platform: ledc
    id: buzzer_pwm
    pin: GPIO6

rtttl:
  - id: rtttl_player
    output: buzzer_pwm

i2c:
  id: i2c_bus
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 100kHz

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    id: my_display
    update_interval: never
    lambda: |-
      float battery_pct = id(battery_capacity).has_state() ? id(battery_capacity).state : NAN;
      keypad_display::render(it, id(lockout_state), id(display_pin), id(failed_attempts),
                              battery_pct, id(font_large), id(font_small));

pcf8574:
  - id: 'pcf8574_hub'
    address: 0x20

matrix_keypad:
  - id: my_keypad
    rows:
      - pin: { pcf8574: pcf8574_hub, number: 7, mode: OUTPUT }
      - pin: { pcf8574: pcf8574_hub, number: 6, mode: OUTPUT }
      - pin: { pcf8574: pcf8574_hub, number: 5, mode: OUTPUT }
      - pin: { pcf8574: pcf8574_hub, number: 4, mode: OUTPUT }
    columns:
      - pin: { pcf8574: pcf8574_hub, number: 3, mode: INPUT }
      - pin: { pcf8574: pcf8574_hub, number: 2, mode: INPUT }
      - pin: { pcf8574: pcf8574_hub, number: 1, mode: INPUT }
      - pin: { pcf8574: pcf8574_hub, number: 0, mode: INPUT }
    keys: "123A456B789C*0#D"

    on_key:
      - if:
          condition:
            lambda: 'return id(lockout_state) == keypad_state::ACTIVE;'
          then:
            - lambda: |-
                id(rtttl_player).play(std::string("beep:d=16,o=6,b=500:") + keypad_tones::note_for_key(x));

                if (x == '#') {
                  ESP_LOGI("keypad", "failed_attempts before submit: %d", id(failed_attempts));
                }
                if (keypad_state::handle_key(x, id(actual_pin), id(display_pin), id(lockout_state))
                    && id(my_display).is_ready()) {
                  id(my_display).update();
                }
            - if:
                condition:
                  lambda: 'return id(lockout_state) == keypad_state::PENDING;'
                then:
                  - script.execute: auth_request_script

script:
  - id: auth_request_script
    mode: single
    then:
      - repeat:
          count: 4
          then:
            - if:
                condition:
                  lambda: 'return id(lockout_state) == 1;'
                then:
                  # 1. Allow the system to catch up before the wait
                  - delay: 10ms

                  - wait_until:
                      condition: api.connected
                      timeout: 2s

                  # 2. Allow the system to catch up after the wait
                  - delay: 10ms

                  - if:
                      condition: api.connected
                      then:
                        - delay: 500ms

                        # 3. Explicitly yield before network-heavy event
                        - delay: 10ms

                        - homeassistant.event:
                            event: esphome.keypad_auth_request
                            data:
                              pin_hash: !lambda |-
                                std::string salted_pin = std::string("${my_hash_salt}") + id(actual_pin);
                                return get_sha256(salted_pin);

                        - delay: 2.5s

sensor:
  - platform: homeassistant
    id: ha_failed_attempts
    entity_id: ${ha_failed_attempts_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            int from_ha = static_cast<int>(x + 0.5f);
            if (from_ha < 0) from_ha = 0;
            if (id(failed_attempts) != from_ha) {
              id(failed_attempts) = from_ha;
              ESP_LOGI("keypad", "Synced failed_attempts from HA: %d", id(failed_attempts));

              keypad_fram::persist_failed_attempts(id(i2c_bus), static_cast<uint8_t>(id(failed_attempts)), "ha_sync");

              if (id(failed_attempts) >= 3) {
                id(lockout_state) = keypad_state::LOCKED;
              }
              if (id(my_display).is_ready()) {
                id(my_display).update();
              }
            }

  - platform: adc
    pin: GPIO1
    name: "Battery Voltage Raw"
    id: battery_voltage_raw
    attenuation: 12db
    update_interval: never
    accuracy_decimals: 2
    filters:
      - multiply: 2.0

  - platform: template
    name: "Battery Capacity"
    id: battery_capacity
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (!id(battery_voltage_raw).has_state()) return {};
      return keypad_battery::voltage_to_percent(id(battery_voltage_raw).state);

deep_sleep:
  id: my_deep_sleep
  wakeup_pin:
    number: GPIO2
    mode: INPUT
    inverted: false
    allow_other_uses: True
  sleep_duration: 6h

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT
      inverted: false
      allow_other_uses: True
    name: "Door Reed Switch"
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
    id: door_switch
    on_release:
      - logger.log: "Door Closed! Entering deep sleep."
      - lambda: |-
          if(id(my_display).is_ready()) {
            id(my_display).fill(Color::BLACK);
            id(my_display).update();
          }
      - delay: 50ms
      - lambda: |-
          if(id(my_display).is_ready()) {
            id(my_display).turn_off();
          }
      - wait_until:
          condition:
            api.connected:
          timeout: 10s
      - delay: 500ms
      - deep_sleep.enter: my_deep_sleep
    on_press:
      - logger.log: "Door Opened! Waking up..."

switch:
  - platform: template
    name: "Keypad Lockout State"
    id: ha_lockout_switch
    lambda: |-
      return id(failed_attempts) >= 3;
    turn_on_action:
      - lambda: |-
          id(failed_attempts) = 3;
          id(lockout_state) = keypad_state::LOCKED;
          if (id(my_display).is_ready()) {
            id(my_display).update();
          }
    turn_off_action:
      - logger.log: "Lockout cleared from Home Assistant"
      - lambda: |-
          id(failed_attempts) = 0;
          keypad_state::reset_pin_entry(id(actual_pin), id(display_pin), id(lockout_state));
          if (id(my_display).is_ready()) {
            id(my_display).update();
          }

logger:
api:
  encryption:
    key: !secret api_key

  services:
    - service: auth_success
      then:
        - lambda: |-
            constexpr uint16_t ADDR_FAILED_ATTEMPTS = 0x0001;

            id(failed_attempts) = 0; // Explicitly reset to 0
            ESP_LOGI("keypad", "Set failed_attempts after auth_success: %d", id(failed_attempts));

            fram_mb85rc256::FramMB85RC256 fram(id(i2c_bus), 0x50);
            if (!fram.write_u8(ADDR_FAILED_ATTEMPTS, 0)) {
              ESP_LOGW("keypad", "Failed to write failed_attempts to FRAM after auth_success");
            }

            id(lockout_state) = 3;
            if (id(my_display).is_ready()) {
              id(my_display).update();
            }
        - rtttl.play: "success:d=16,o=6,b=400:c6,b6,c7,c7,b6,d7"

    - service: auth_fail
      then:
        - lambda: |-
            constexpr uint16_t ADDR_FAILED_ATTEMPTS = 0x0001;

            id(lockout_state) = 2;
            id(failed_attempts) = id(failed_attempts) + 1; // Fixed: Use explicit assignment
            ESP_LOGI("keypad", "Set failed_attempts after auth_fail: %d", id(failed_attempts));

            fram_mb85rc256::FramMB85RC256 fram(id(i2c_bus), 0x50);
            if (!fram.write_u8(ADDR_FAILED_ATTEMPTS, static_cast<uint8_t>(id(failed_attempts)))) {
              ESP_LOGW("keypad", "Failed to write failed_attempts to FRAM after auth_fail");
            }

            if (id(my_display).is_ready()) {
              id(my_display).update();
            }
        - rtttl.play: "fail:d=32,o=6,b=400:d7,c7,b6,b6,c7,b6"
        - if:
            condition:
              lambda: 'return id(failed_attempts) < 3;'
            then:
              - delay: 3s
              - lambda: |-
                  id(actual_pin) = "";
                  id(display_pin) = "";
                  id(lockout_state) = 0;
                  if (id(my_display).is_ready()) {
                    id(my_display).update();
                  }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
