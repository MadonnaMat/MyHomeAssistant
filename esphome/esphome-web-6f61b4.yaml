esphome:
  name: esphome-web-6f61b4
  friendly_name: test-esp32
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - lambda: |-
          uint8_t magic = 0;
          uint8_t state = 0;

          uint8_t addr_magic[2] = {0x00, 0x00};
          uint8_t addr_state[2] = {0x00, 0x01};
          auto err_magic = id(i2c_bus).write_read(0x50, addr_magic, 2, &magic, 1);
          auto err_state = id(i2c_bus).write_read(0x50, addr_state, 2, &state, 1);

          if (err_magic == esphome::i2c::ERROR_OK && err_state == esphome::i2c::ERROR_OK && magic == 0xA5) {
            id(led_state) = state != 0;
            ESP_LOGI("fram", "Restored LED state from FRAM: %s", id(led_state) ? "ON" : "OFF");
          } else {
            id(led_state) = false;
            ESP_LOGI("fram", "FRAM empty/uninitialized, default LED state OFF");
          }

          if (id(led_state)) {
            id(user_led).turn_on();
          } else {
            id(user_led).turn_off();
          }

esp32:
  variant: esp32
  framework:
    type: arduino

i2c:
  id: i2c_bus
  sda: GPIO21
  scl: GPIO22
  scan: true

globals:
  - id: led_state
    type: bool
    restore_value: no
    initial_value: "false"

output:
  - platform: gpio
    id: user_led
    pin: GPIO4

binary_sensor:
  - platform: gpio
    id: toggle_button
    name: "Toggle FRAM LED"
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - lambda: |-
          id(led_state) = !id(led_state);

          if (id(led_state)) {
            id(user_led).turn_on();
          } else {
            id(user_led).turn_off();
          }

          const uint8_t magic = 0xA5;
          const uint8_t state = id(led_state) ? 1 : 0;
          uint8_t write_magic[3] = {0x00, 0x00, magic};
          uint8_t write_state[3] = {0x00, 0x01, state};
          auto ok_magic = id(i2c_bus).write(0x50, write_magic, 3) == esphome::i2c::ERROR_OK;
          auto ok_state = id(i2c_bus).write(0x50, write_state, 3) == esphome::i2c::ERROR_OK;

          if (ok_magic && ok_state) {
            ESP_LOGI("fram", "Saved LED state to FRAM: %s", id(led_state) ? "ON" : "OFF");
          } else {
            ESP_LOGW("fram", "Failed to save LED state to FRAM");
          }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
