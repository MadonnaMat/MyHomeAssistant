esphome:
  name: esphome-web-6f61b4
  friendly_name: test-esp32
  min_version: 2025.11.0
  name_add_mac_suffix: false
  includes:
    - fram_mb85rc256.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          constexpr uint16_t ADDR_MARKER = 0x0000;
          constexpr uint16_t ADDR_LED_STATE = 0x0001;
          constexpr uint16_t ADDR_PRESS_COUNT = 0x0004;
          constexpr uint16_t ADDR_TEST_U8 = 0x0010;
          constexpr uint16_t ADDR_TEST_BYTES = 0x0020;
          constexpr uint16_t ADDR_TEST_U32 = 0x0030;

          bool state = false;
          uint32_t count = 0;
          fram_mb85rc256::FramMB85RC256 fram(id(i2c_bus), 0x50);

          const bool ok_magic = fram.check_marker(ADDR_MARKER);
          const bool ok_state = fram.read_bool(ADDR_LED_STATE, state);
          const bool ok_count = fram.read_value<uint32_t>(ADDR_PRESS_COUNT, count);

          if (ok_magic && ok_state && ok_count) {
            id(led_state) = state;
            id(press_count) = count;
            ESP_LOGI("fram", "Restored LED state from FRAM: %s", id(led_state) ? "ON" : "OFF");
            ESP_LOGI("fram", "Restored press count from FRAM: %u", id(press_count));
          } else {
            id(led_state) = false;
            id(press_count) = 0;
            fram.write_marker(ADDR_MARKER);
            fram.write_bool(ADDR_LED_STATE, id(led_state));
            fram.write_value<uint32_t>(ADDR_PRESS_COUNT, id(press_count));
            ESP_LOGI("fram", "FRAM empty/uninitialized, defaulting LED=OFF count=0");
          }

          if (id(led_state)) {
            id(user_led).turn_on();
          } else {
            id(user_led).turn_off();
          }

          // Self-tests for helper methods.
          uint8_t u8_v = 0;
          const bool t_u8_wr = fram.write_u8(ADDR_TEST_U8, 0x5A);
          const bool t_u8_rd = fram.read_u8(ADDR_TEST_U8, u8_v);
          ESP_LOGI("fram", "TEST write_u8/read_u8: %s", (t_u8_wr && t_u8_rd && u8_v == 0x5A) ? "PASS" : "FAIL");

          uint8_t u8_or = 0;
          const bool t_u8_or = fram.read_u8_or(ADDR_TEST_U8, 0xEE, u8_or);
          ESP_LOGI("fram", "TEST read_u8_or: %s (read=%s value=0x%02X)",
                   (t_u8_or && u8_or == 0x5A) ? "PASS" : "FAIL",
                   t_u8_or ? "true" : "false", u8_or);

          const uint8_t tx[4] = {0x11, 0x22, 0x33, 0x44};
          uint8_t rx[4] = {0, 0, 0, 0};
          const bool t_bytes_wr = fram.write_bytes(ADDR_TEST_BYTES, tx, sizeof(tx));
          const bool t_bytes_rd = fram.read_bytes(ADDR_TEST_BYTES, rx, sizeof(rx));
          const bool t_bytes_ok = t_bytes_wr && t_bytes_rd && std::memcmp(tx, rx, sizeof(tx)) == 0;
          ESP_LOGI("fram", "TEST write_bytes/read_bytes: %s", t_bytes_ok ? "PASS" : "FAIL");

          const uint32_t v32_tx = 0x12345678;
          uint32_t v32_rx = 0;
          const bool t_v32_wr = fram.write_value<uint32_t>(ADDR_TEST_U32, v32_tx);
          const bool t_v32_rd = fram.read_value<uint32_t>(ADDR_TEST_U32, v32_rx);
          ESP_LOGI("fram", "TEST write_value/read_value<uint32_t>: %s", (t_v32_wr && t_v32_rd && v32_rx == v32_tx) ? "PASS" : "FAIL");

          const bool marker_ok = fram.check_marker(ADDR_MARKER);
          ESP_LOGI("fram", "TEST check_marker/write_marker: %s", marker_ok ? "PASS" : "FAIL");

esp32:
  variant: esp32
  framework:
    type: arduino

logger:
  level: DEBUG

api:

i2c:
  id: i2c_bus
  sda: GPIO21
  scl: GPIO22
  scan: true

globals:
  - id: led_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: press_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

output:
  - platform: gpio
          constexpr uint16_t ADDR_MARKER = 0x0000;
          constexpr uint16_t ADDR_LED_STATE = 0x0001;
          constexpr uint16_t ADDR_PRESS_COUNT = 0x0004;

    id: user_led
          id(press_count)++;
          fram_mb85rc256::FramMB85RC256 fram(id(i2c_bus), 0x50);
    pin: GPIO4

binary_sensor:
  - platform: gpio
    id: toggle_button
    name: "Toggle FRAM LED"
    pin:
          const bool ok_marker = fram.write_marker(ADDR_MARKER);
          const bool ok_state = fram.write_bool(ADDR_LED_STATE, id(led_state));
          const bool ok_count = fram.write_value<uint32_t>(ADDR_PRESS_COUNT, id(press_count));
        pullup: true
          if (ok_marker && ok_state && ok_count) {
            ESP_LOGI("fram", "Button press #%u, LED=%s (saved to FRAM)", id(press_count), id(led_state) ? "ON" : "OFF");
      - delayed_on: 30ms
            ESP_LOGW("fram", "Failed FRAM save on press #%u (marker=%s state=%s count=%s)",
                     id(press_count), ok_marker ? "ok" : "fail", ok_state ? "ok" : "fail", ok_count ? "ok" : "fail");
    on_press:
      - lambda: |-
          id(led_state) = !id(led_state);
          fram_mb85rc256::FramMB85RC256 fram(id(i2c_bus), 0x50);

          if (id(led_state)) {
            id(user_led).turn_on();
          } else {
            id(user_led).turn_off();
          }

          const bool state = id(led_state);
          const bool ok_state = fram.write_bool(0x0001, state);
          const bool ok_magic = fram.write_marker(0x0000);

          if (ok_magic && ok_state) {
            ESP_LOGI("fram", "Saved LED state to FRAM: %s", id(led_state) ? "ON" : "OFF");
          } else {
            ESP_LOGW("fram", "Failed to save LED state to FRAM");
          }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
