esphome:
  name: esphome-web-6f61b4
  friendly_name: test-esp32
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: arduino

external_components:
  - source: github://pr#4880
    components: [fram, fram_pref]
    refresh: 1h

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

fram:
  - id: fram_store
    address: 0x50
    type: FRAM16
    size: 32KiB

fram_pref:
  id: fram_pref_store
  fram_id: fram_store
  pool_start: 0
  pool_size: 4096

switch:
  - platform: gpio
    id: led_switch
    name: "FRAM LED"
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    id: toggle_button
    name: "Toggle FRAM LED"
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - switch.toggle: led_switch

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
